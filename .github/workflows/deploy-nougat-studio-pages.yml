name: Nougat Studio Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "pages/**"
      - ".nojekyll"
      - ".github/workflows/deploy-nougat-studio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nougat-studio-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Build Nougat Studio Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp styles.css _site/styles.css
          test -f app.js && cp app.js _site/app.js || true
          if [ -d pages ]; then cp -R pages _site/pages; fi

          # Preserve the approved home UI exactly from the currently deployed site.
          # This avoids any resampling, conversion, or reconstruction of the asset.
          curl -fL 'https://dereksparks1982.github.io/nougatstudio/assets/nougat-studio-approved-ui.png' -o _site/assets/nougat-studio-approved-ui.png
          test "$(stat -c %s _site/assets/nougat-studio-approved-ui.png)" = '2504844'
          echo 'c86db5dd40882b09002df0b5bd5d6962e8d0d42532252237d71561e731bb49ca  _site/assets/nougat-studio-approved-ui.png' | sha256sum -c -
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
