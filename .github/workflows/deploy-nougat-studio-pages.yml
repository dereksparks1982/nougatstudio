name: Nougat Studio Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - ".nojekyll"
      - ".github/workflows/deploy-nougat-studio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nougat-studio-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Build exact approved Nougat Studio home
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp styles.css _site/styles.css
          test -f app.js && cp app.js _site/app.js || true
          curl -fL 'https://sdmntprnorthcentralus.oaiusercontent.com/files/00000000-3508-822f-b62c-0612ad83be06/raw?se=2026-09-28T18%3A58%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=6a27a5e0-9d94-5188-80be-d772b693d8ba&skoid=c36a4874-d531-4a8d-99fc-7da0d9143d9c&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T23%3A50%3A11Z&ske=2026-09-28T23%3A50%3A11Z&sks=b&skv=2026-02-06&sig=mEdQWIwv0s46A7JD07wFDLngGQDYtDjGuIZ1T1vDOHI%3D' -o _site/assets/nougat-studio-approved-ui.png
          test "$(stat -c %s _site/assets/nougat-studio-approved-ui.png)" = '2504844'
          echo 'c86db5dd40882b09002df0b5bd5d6962e8d0d42532252237d71561e731bb49ca  _site/assets/nougat-studio-approved-ui.png' | sha256sum -c -
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
