name: Nougat Studio Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "pages/**"
      - ".nojekyll"
      - ".github/workflows/deploy-nougat-studio-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pages: write
  id-token: write

concurrency:
  group: nougat-studio-pages
  cancel-in-progress: true

jobs:
  setup-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Force workflow Pages mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/gh-pages" || true
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow || true

  deploy:
    needs: setup-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Recover verified approved UI asset
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: _seed
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36468683098

      - name: Build self-contained Nougat Studio Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site _seed_site
          mkdir -p _site/assets _seed_site
          cp index.html _site/index.html
          cp styles.css _site/styles.css
          test -f app.js && cp app.js _site/app.js || true
          if [ -d pages ]; then cp -R pages _site/pages; fi

          tar -xf _seed/artifact.tar -C _seed_site
          cp _seed_site/assets/nougat-studio-approved-ui.png _site/assets/nougat-studio-approved-ui.png
          test "$(stat -c %s _site/assets/nougat-studio-approved-ui.png)" = '2504844'
          echo 'c86db5dd40882b09002df0b5bd5d6962e8d0d42532252237d71561e731bb49ca  _site/assets/nougat-studio-approved-ui.png' | sha256sum -c -

          python3 - <<'PY'
          from pathlib import Path
          import base64
          index = Path('_site/index.html')
          image = Path('_site/assets/nougat-studio-approved-ui.png')
          html = index.read_text()
          data = base64.b64encode(image.read_bytes()).decode('ascii')
          expected = 'src="assets/nougat-studio-approved-ui.png"'
          replacement = 'src="data:image/png;base64,' + data + '"'
          if expected not in html:
              raise SystemExit('approved UI image reference not found in index.html')
          index.write_text(html.replace(expected, replacement, 1))
          PY

          grep -q 'data:image/png;base64,' _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
