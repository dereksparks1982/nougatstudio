</head>

        <a class="hotspot" data-workspace="media" href="#media" aria-label="Media" style="--x:62.0;--y:14.4;--w:6.6;--h:7.6"></a>
        <a class="hotspot" data-workspace="editing" href="#editing" aria-label="Editing" style="--x:68.7;--y:14.4;--w:7.2;--h:7.6"></a>
        <a class="hotspot" data-workspace="sound" href="#sound" aria-label="Sound" style="--x:75.9;--y:14.4;--w:7.0;--h:7.6"></a>
        <a class="hotspot" data-workspace="export" href="#export" aria-label="Export" style="--x:82.8;--y:14.4;--w:7.2;--h:7.6"></a>

        <a class="hotspot" data-workspace="characters" href="#characters" aria-label="Characters" style="--x:18.1;--y:44.5;--w:15.4;--h:14.5"></a>
        <a class="hotspot" data-workspace="locations" href="#locations" aria-label="Locations" style="--x:34.4;--y:44.5;--w:15.4;--h:14.5"></a>
        <a class="hotspot" data-workspace="storyboards" href="#storyboards" aria-label="Storyboards" style="--x:50.5;--y:44.5;--w:15.5;--h:14.5"></a>

      </nav>
    </div>
  </main>

  <script>
    document.querySelectorAll('.hotspot').forEach((hotspot) => {
      hotspot.addEventListener('click', (event) => {
        const workspace = hotspot.dataset.workspace;
        if (workspace === 'home') {
          event.preventDefault();
          history.replaceState(null, '', location.pathname);
          window.scrollTo({top: 0, behavior: 'smooth'});
        }
      });
    });
  </script>
</body>
</html>
